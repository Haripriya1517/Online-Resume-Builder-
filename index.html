<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeCraft - Online Resume Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>RESUMECRAFT</h1>
    <p>Build Your Professional Resume Easily</p>
</header>

<div class="container">

    <section class="form-section">
        <h2>Create Your Resume</h2>

        <form id="resumeForm">

            <label>Profile Photo</label>
            <input type="file" id="photo" accept="image/*">

            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter phone number">

            <label>Address</label>
            <input type="text" id="address" placeholder="Enter your address">

            <label>Career Objective</label>
            <textarea id="objective" placeholder="Write your career objective"></textarea>

            <h3>Education</h3>

            <label>Degree</label>
            <input type="text" id="degree" placeholder="BCA">

            <label>College Name</label>
            <input type="text" id="college" placeholder="Enter college name">

            <label>Year of Passing</label>
            <input type="text" id="year" placeholder="2027">

            <label>Percentage / CGPA</label>
            <input type="text" id="percentage" placeholder="Enter percentage or CGPA">

            <h3>Skills</h3>
            <textarea id="skills" placeholder="HTML, CSS, JavaScript"></textarea>

            <h3>Projects</h3>
            <textarea id="projects" placeholder="Enter your projects"></textarea>

            <h3>Certifications</h3>
            <textarea id="certifications" placeholder="Enter your certifications"></textarea>

            <button type="button" onclick="generateResume()">
                Generate Resume
            </button>

            <button type="button" class="reset" onclick="resetForm()">
                Reset
            </button>

        </form>
    </section>

    <section class="preview-section">
        <h2>Resume Preview</h2>

        <div id="resumePreview">

            <div class="resume-header">
                <img id="previewPhoto" alt="Profile Photo">

                <div>
                    <h1 id="previewName">Your Name</h1>
                    <p id="previewEmail"></p>
                    <p id="previewPhone"></p>
                    <p id="previewAddress"></p>
                </div>
            </div>

            <hr>

            <h3>Career Objective</h3>
            <p id="previewObjective"></p>

            <h3>Education</h3>
            <p id="previewDegree"></p>
            <p id="previewCollege"></p>
            <p id="previewYear"></p>
            <p id="previewPercentage"></p>

            <h3>Skills</h3>
            <p id="previewSkills"></p>

            <h3>Projects</h3>
            <p id="previewProjects"></p>

            <h3>Certifications</h3>
            <p id="previewCertifications"></p>

        </div>

        <button type="button" onclick="printResume()">
            Print / Save as PDF
        </button>

    </section>

</div>

<script src="script.js"></script>
</body>
  </html>
